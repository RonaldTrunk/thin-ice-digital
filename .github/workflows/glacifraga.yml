name: Glacifraga tests

on:
  push:
    paths:
      - "glacifraga-trading/**"
      - ".github/workflows/glacifraga.yml"
  pull_request:
    paths:
      - "glacifraga-trading/**"
      - ".github/workflows/glacifraga.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glacifraga-trading
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: pytest
